site_name: rpg-wiki
site_description: Wiki poświęcone grom fabularnym i systemom RPG
site_url: https://geshura.github.io/rpg-wiki/
repo_url: https://github.com/geshura/rpg-wiki/
edit_uri: edit/main/docs/

nav:
  - Strona główna: index.md
  - Artefakty:
    - Artefakty: artefakty.md
    - Brisingamen: artefakty/brisingamen.md
    - Czara Mgieł: artefakty/czara_mgiel.md
    - Nothung: artefakty/nothung.md
  - Pochodzenia:
    - Pochodzenia: pochodzenia.md
    - Ork: pochodzenia/ork.md
    - Goblin: pochodzenia/goblin.md
    - Niziołek: pochodzenia/niziolek.md
  - Ścieżki Mistrzowskie:
    - Ścieżki Mistrzowskie: sciezki_mistrzowskie.md
    - Mag Zagłady: sciezki_mistrzowskie/mag_zaglady.md
    - Mag Bitewny: sciezki_mistrzowskie/mag_bitewny.md
    - Taumaturg: sciezki_mistrzowskie/taumaturg.md
  - Ścieżki Eksperckie:
    - Ścieżki Eksperckie: sciezki_eksperckie.md
    - Paladyn: sciezki_eksperckie/paladyn.md
    - Skrytobójca: sciezki_eksperckie/skrytobojca.md
    - Zaklinacz: sciezki_eksperckie/zaklinacz.md
  - Tradycje Magii:
    - Tradycje Magii: tradycje_magii.md
    - Nekromancja: tradycje_magii/nekromancja.md
    - Telepatia: tradycje_magii/telepatia.md
    - Teleportacja: tradycje_magii/teleportacja.md

theme:
  name: material
  language: pl
  palette:
    # Ciemny motyw
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Przełącz na jasny motyw
    # Jasny motyw
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Przełącz na ciemny motyw
  features:
    - navigation.tabs        # Menu na górze jak w nowoczesnych stronach
    - navigation.sections    # Rozwijane sekcje w menu bocznym
    - navigation.expand      # Domyślnie rozwinięte menu
    - search.suggest         # Podpowiedzi w wyszukiwarce
    - search.highlight       # Podświetlanie szukanych słów
    - content.code.copy      # Kopiowanie bloków tekstu

plugins:
  - search

markdown_extensions:
  - admonition               # Pozwala na ramki "Ostrzeżenie", "Notatka"
  - pymdownx.details         # Zwijane bloki tekstu (np. statystyki bossa)
  - pymdownx.superfences     # Lepsze bloki kodu
  - attr_list                # Pozwala dodawać klasy CSS do elementów

extra_css:
  - stylesheets/extra.css