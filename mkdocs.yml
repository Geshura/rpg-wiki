site_name: rpg-wiki
site_url: https://twoja-strona.com
repo_url: https://github.com/Geshura/rpg-wiki
theme:
  name: material
  language: pl
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Przełącz na tryb ciemny
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Przełącz na tryb jasny
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

plugins:
  - search

extra_javascript:
  - assets/javascripts/toc-widget.js

extra_css:
  - assets/stylesheets/toc-widget.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

nav:
  - Strona główna: index.md
  - Cień Władcy Demonów:
    - Przegląd: compendium/shadow_demon_lord/index.md
    - Pochodzenia:
      - Automaton: compendium/shadow_demon_lord/origins/automaton.md
      - Człowiek: compendium/shadow_demon_lord/origins/czlowiek.md
      - Goblin: compendium/shadow_demon_lord/origins/goblin.md
    - Ścieżki Eksperckie:
      - Wyrocznia: compendium/shadow_demon_lord/expert_paths/wyrocznia.md
    - Tradycje Magii: compendium/shadow_demon_lord/magic_traditions/index.md
    - Zaklęcia: compendium/shadow_demon_lord/spells/index.md