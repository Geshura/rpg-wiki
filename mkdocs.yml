site_name: RPG Wiki System
site_url: https://twoja-strona.com
theme:
  name: material
  language: pl
  palette: 
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Przełącz na tryb ciemny
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Przełącz na tryb jasny
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.details

nav:
  - Strona główna: index.md
  - Cień Władcy Demonów:
    - Przegląd: cwd/index.md
    - Pochodzenia:
      - Automaton: cwd/pochodzenia/automaton.md
      - Człowiek: cwd/pochodzenia/czlowiek.md
      - Goblin: cwd/pochodzenia/goblin.md
    - Ścieżki Eksperckie:
