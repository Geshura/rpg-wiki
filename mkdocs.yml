site_name: Cień Władcy Demonów — Kompendium
site_url: https://geshura.github.io/rpg-wiki
repo_url: https://github.com/Geshura/rpg-wiki
use_directory_urls: false

# Konfiguracja motywu na język polski
theme:
  name: readthedocs
  locale: pl                     # Wymusza polski interfejs (Szukaj, Dalej, Wstecz)
  highlightjs: true              # Podświetlanie składni kodu
  collapse_navigation: true      # Zwija podkategorie (niezbędne przy tylu zaklęciach)
  sticky_navigation: true        # Menu boczne przewija się z treścią
  navigation_depth: 4            # Pozwala na głębsze zagnieżdżenie (Kategorie zaklęć)
  titles_only: false             # Pokazuje nagłówki wewnątrz plików w menu

# Dodatkowe style i skrypty (zgodnie z Twoimi danymi)
extra_css:
  - assets/stylesheets/toc-widget.css
  - assets/stylesheets/custom.css

extra_javascript:
  - assets/javascripts/toc-widget.js

# Wtyczki
plugins:
  - search
  - awesome-pages # Pozwala na automatyczne sortowanie, jeśli usuniesz sekcję 'nav'

# Rozszerzenia Markdown
markdown_extensions:
  - admonition
  - toc:
      permalink: true

# Struktura nawigacji (Poprawiona, bez duplikatów i zorganizowana)
