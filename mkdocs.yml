site_name: rpg-wiki
site_description: Wiki poświęcone grom fabularnym i systemom RPG
site_url: https://geshura.github.io/rpg-wiki/
repo_url: https://github.com/geshura/rpg-wiki/
edit_uri: edit/main/docs/

nav:
  - Strona główna: 
    - Indeks: index.md
    - admonitions: testy/faq.md
    - content tabs: testy/content_tabs.md
    - kostka: testy/kostka.md
    - przyciski: testy/przyciski.md
    - zaklęcie: testy/zaklecie.md
  - Artefakty:
    - Indeks: artefakty.md
    - Brisingamen: artefakty/brisingamen.md
    - Brzmiący róg: artefakty/brzmiący_róg.md
    - Chytry uśmiech: artefakty/chytry_uśmiech.md
  - Ścieżki Eksperckie:
    - Indeks: sciezki_eksperckie.md
    - Apostata: sciezki_eksperckie/apostata.md
    - Berserker: sciezki_eksperckie/berserker.md
    - Czarnoksieznik: sciezki_eksperckie/czarnoksieznik.md
  - Ścieżki Mistrzowskie:
    - Indeks: sciezki_mistrzowskie.md
    - Aeromanta: sciezki_mistrzowskie/aeromanta.md
    - Akrobata: sciezki_mistrzowskie/akrobata.md
    - Astromanta: sciezki_mistrzowskie/astromanta.md
  - Zaklęcia:
    - Indeks: zaklecia.md
    - Adamantytowe łańcuchy: zaklecia/adamantytowe_łańcuchy.md
    - Akceleracja: zaklecia/akceleracja.md
    - Akumulacja magii: zaklecia/akumulacja_magii.md
  - Kampania:
    - Indeks: kampania.md
    - BG:
      - Adam: kampania/BG/adam.md
      - Kacper: kampania/BG/kacper.md
      - Macieja: kampania/BG/macieja.md
      - Michal: kampania/BG/michal.md
      - Oskar: kampania/BG/oskar.md
    - BN:
      - Barnaba: kampania/BN/Barnaba.md
      - Francessca: kampania/BN/Francessca.md
      - Matylda: kampania/BN/Matylda.md
      - Ostatni Liść: kampania/BN/Ostatni_Liść.md
      - Ruella: kampania/BN/Ruella.md
      - Vernus: kampania/BN/Vernus.md
    - Wątek:
      - Pielgrzymka: kampania/Wątek/Pielgrzymka.md
      - Sześciogród: kampania/Wątek/Sześciogród.md
    - Wydarzenia:
      - Atak anioła: kampania/Wydarzenia/Atak_anioła.md

theme:
  name: material
  language: pl
  palette:
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Przełącz na jasny motyw
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Przełącz na ciemny motyw
  features:
    - navigation.tabs        # Menu na górze jak w nowoczesnych stronach
    - navigation.sections    # Rozwijane sekcje w menu bocznym
    - navigation.expand      # Domyślnie rozwinięte menu
    - search.suggest         # Podpowiedzi w wyszukiwarce
    - search.highlight       # Podświetlanie szukanych słów
    - content.code.copy      # Kopiowanie bloków tekstu

plugins:
  - search

markdown_extensions:
  - admonition               # Pozwala na ramki "Ostrzeżenie", "Notatka"
  - pymdownx.details         # Zwijane bloki tekstu (np. statystyki bossa)
  - pymdownx.superfences     # Lepsze bloki kodu
  - attr_list                # Pozwala dodawać klasy CSS do elementów
  - toc:
      permalink: true
  
extra_css:
  - css/custom_admonition.css
  - css/kostka.css
  - css/rycina.css
