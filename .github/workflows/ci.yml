name: build_wikirpg
on:
  push:
    branches:
      - main
      - master
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Instalacja zależności Pythona
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install mkdocs mkdocs-material mkdocs-awesome-pages-plugin; fi

      - name: Buduj dokumentację
        run: mkdocs build --clean

      - name: Postprocess site HTML
        run: python scripts/postprocess_site.py

      - name: Publikuj na GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./site
          github_token: ${{ secrets.GITHUB_TOKEN }}
